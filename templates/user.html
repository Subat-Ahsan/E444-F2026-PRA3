{% extends "base.html" %}

{% block page_content %}

<h1>Welcome</h1>

<form method="POST">
    {{ form.hidden_tag() }}

    <div class="form-group">
        {{ form.name.label }}
        {{ form.name(class="form-control") }}
    </div>

    <div class="form-group">
        {{ form.email.label }}
        {{ form.email(class="form-control") }}
    </div>

    <br>

    {{ form.submit(class="btn btn-primary") }}
</form>

{% endblock %}
